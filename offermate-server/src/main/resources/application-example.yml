spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:offermate}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:your_redis_password}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:your_rabbitmq_username}
    password: ${RABBITMQ_PASSWORD:your_rabbitmq_password}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
  ai:
    zhipuai:
      api-key: ${AI_API_KEY:your_zhipuai_api_key}
      chat:
        options:
          model: ${AI_MODEL:glm-4-flash}
          temperature: ${AI_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:embedding-3}
          dimensions: 1024
    vectorstore:
      pgvector:
        url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${PGVECTOR_USERNAME:root}
        password: ${PGVECTOR_PASSWORD:1234}
        driver-class-name: org.postgresql.Driver
        dimensions: 1024
        distance-type: COSINE
        index-type: HNSW
        initialize-schema: true

offermate:
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret}
    expire: ${JWT_EXPIRE:604800000}
  ai:
    rag:
      enabled: ${AI_RAG_ENABLED:true}
      documents-path: ${AI_RAG_DOCS:classpath:documents/}
      chunk-size: 300
      max-results: 3
      min-score: 0.6
    memory:
      max-messages: 30
      redis-ttl-seconds: 1800

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:your_minio_access_key}
  secretKey: ${MINIO_SECRET_KEY:your_minio_secret_key}
  bucket: ${MINIO_BUCKET:offermate}
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000/offermate}

elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
