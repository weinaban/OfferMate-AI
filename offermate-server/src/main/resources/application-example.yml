spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:offermate}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:your_redis_password}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:your_rabbitmq_username}
    password: ${RABBITMQ_PASSWORD:your_rabbitmq_password}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
  ai:
    openai:
      api-key: ${AI_API_KEY:your_ai_api_key}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_MODEL:qwen-plus}
          temperature: ${AI_TEMPERATURE:0.7}

offermate:
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret}
    expire: ${JWT_EXPIRE:604800000}

ai:
  dashscope:
    api-key: ${AI_API_KEY:your_ai_api_key}
    base-url: ${AI_DASHSCOPE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    chat:
      options:
        model: ${AI_MODEL:qwen-plus}
        temperature: ${AI_TEMPERATURE:0.7}

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${AI_API_KEY:your_ai_api_key}
        model-name: ${AI_MODEL:qwen-plus}
        temperature: ${AI_TEMPERATURE:0.7}
        max-tokens: ${AI_MAX_TOKENS:2000}
      embedding-model:
        api-key: ${AI_API_KEY:your_ai_api_key}
        model-name: ${AI_EMBEDDING_MODEL:text-embedding-v2}

offermate:
  ai:
    rag:
      enabled: ${AI_RAG_ENABLED:true}
      documents-path: ${AI_RAG_DOCS:classpath:documents/}
      chunk-size: 300
      chunk-overlap: 30
      max-results: 3
      min-score: 0.6
    memory:
      max-messages: 30

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:your_minio_access_key}
  secretKey: ${MINIO_SECRET_KEY:your_minio_secret_key}
  bucket: ${MINIO_BUCKET:offermate}
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000/offermate}

elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
